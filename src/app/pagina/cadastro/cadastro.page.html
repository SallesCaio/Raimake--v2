<ion-header [translucent]="true">
  <ion-toolbar class="raimake-bar" style="--min-height: 60px;">
    <ion-buttons slot="start">
      <ion-menu-button auto-hide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>
      <div class="header-brand">
        <img src="assets/img/logo.png" class="logo-home" alt="byRaiMake">
        <span class="header-tagline">SUA BELEZA. SEU GLOW.</span>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="contato-bg">
  <section class="contato-hero">
    <h1>Fale com a byRaiMake</h1>
    <p>Consulte disponibilidade, tire dúvidas ou finalize seu pedido.</p>
  </section>

  <ion-list class="contato-list">
    <ion-item button (click)="abrirWhatsapp()">
      <ion-icon name="logo-whatsapp" slot="start" color="success"></ion-icon>
      <ion-label>
        <h2>WhatsApp</h2>
        <p>(21) 97057-9631</p>
      </ion-label>
    </ion-item>
    <ion-item button (click)="abrirInsta()">
      <ion-icon name="logo-instagram" slot="start" color="tertiary"></ion-icon>
      <ion-label>
        <h2>Instagram</h2>
        <p>&#64;byraimakes</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>Área de Entrega</h2>
        <p>{{ entrega }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="contato-info">
    <p class="disponibilidade">* Consulte disponibilidade. Produtos sujeitos a falta de estoque.</p>
  </div>
</ion-content>
