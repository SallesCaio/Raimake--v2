<ion-header [translucent]="true">
  <ion-toolbar class="raimake-bar">
    <ion-title>Catálogo</ion-title>
    <ion-menu-button slot="start"></ion-menu-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="cat-bg">
  <ion-grid>
    <ion-row>
      <ion-col size="6" sizeMd="4" *ngFor="let p of produtos">
        <ion-card class="prod-card">
          <div class="prod-img" [style.backgroundImage]="'url(' + p.img + ')'"></div>
          <ion-card-content>
            <ion-label class="prod-cat">{{ p.cat }}</ion-label>
            <ion-card-title class="prod-nome">{{ p.nome }}</ion-card-title>
            <div class="prod-rodape">
              <span class="prod-preco">R$ {{ p.preco.toFixed(2) }}</span>
              <ion-button fill="clear" color="tertiary" size="small" (click)="add(p)">
                <ion-icon name="add-circle" slot="icon-only"></ion-icon>
              </ion-button>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
